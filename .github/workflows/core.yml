name: Clipboard Core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: windows-2022
    env:
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify clipboard core
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-core.ps1

  windows-client:
    runs-on: windows-2022
    env:
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Windows App SDK NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-windows-app-sdk-1.8.260710003

      - name: Install Windows App Runtime
        shell: pwsh
        run: winget install --id Microsoft.WindowsAppRuntime.1.8 --exact --silent --accept-source-agreements --accept-package-agreements

      - name: Verify Windows clipboard client
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-windows-client.ps1 -SkipGuiSmoke
