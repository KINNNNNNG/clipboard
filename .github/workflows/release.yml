name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号，例如 0.1.0'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: write

jobs:
  core:
    name: Verify Rust core
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Rust core verification
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test -p clipboard-core --lib
          cargo test --workspace --all-targets --exclude clipboard-core
          cargo clippy --workspace --all-targets --all-features -- -D warnings

  windows-client:
    name: Build Windows installer
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = $env:REF_NAME
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Tag 必须符合 vMAJOR.MINOR.PATCH：$tag"
            }
            $version = $tag.Substring(1)
          } else {
            $version = $env:INPUT_VERSION
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "版本号必须符合 MAJOR.MINOR.PATCH：$version"
            }
            $tag = "v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Windows App SDK NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-windows-app-sdk-1.8.260710003

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress --limit-output

      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pwsh -NoProfile -File scripts/package-windows.ps1 -Version $env:RELEASE_VERSION

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-Windows-v${{ steps.version.outputs.version }}
          path: |
            artifacts/windows/installer/Clipboard-Setup-v${{ steps.version.outputs.version }}.exe
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-Release-Files-v${{ steps.version.outputs.version }}
          path: |
            artifacts/windows/installer/Clipboard-Setup-v${{ steps.version.outputs.version }}.exe
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [core, windows-client]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag 格式错误: $tag"; exit 1; }
            version="${tag#v}"
          else
            version="$INPUT_VERSION"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "版本号格式错误: $version"; exit 1; }
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: Clipboard-Release-Files-v${{ steps.version.outputs.version }}
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Clipboard v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-files/Clipboard-Setup-v${{ steps.version.outputs.version }}.exe
            release-files/SHA256SUMS.txt
