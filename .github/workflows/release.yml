name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号，例如 0.1.0'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = $env:REF_NAME
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Tag 必须符合 vMAJOR.MINOR.PATCH：$tag"
            }
            $version = $tag.Substring(1)
          } else {
            $version = $env:INPUT_VERSION
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "版本号必须符合 MAJOR.MINOR.PATCH：$version"
            }
            $tag = "v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        uses: ilammy/setup-innosetup@v1

      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pwsh -NoProfile -File scripts/package-windows.ps1 -Version $env:RELEASE_VERSION

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipboard-Windows-v${{ steps.version.outputs.version }}
          path: |
            artifacts/windows/installer/Clipboard-Setup-v${{ steps.version.outputs.version }}.exe
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Clipboard v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/windows/installer/Clipboard-Setup-v${{ steps.version.outputs.version }}.exe
            artifacts/windows/SHA256SUMS.txt
