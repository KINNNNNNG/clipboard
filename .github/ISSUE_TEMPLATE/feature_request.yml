name: 功能建议
description: 提出一项新功能或改进
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请说明要解决的问题，而不只是期望的实现方式。
        与既有路线冲突时，可先查阅路线图与开发状态。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前的使用场景中遇到了什么困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 描述期望的行为与交互，包含边界情况。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: textarea
    id: constraints
    attributes:
      label: 安全与隐私影响
      description: 该功能是否需要网络、额外权限、新凭据，或会影响本地-only 与端到端加密边界。
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索过现有 Issue 与路线图，确认该建议尚未覆盖。
          required: true
